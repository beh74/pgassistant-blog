
baseURL = "https://beh74.github.io/pgassistant-blog/"
languageCode = "en-us"
title = "pgAssistant — Continuous PostgreSQL Improvement"
theme = "PaperMod"
pagination.pagerSize = 10
defaultContentLanguage = "en"

#relativeURLs = true
#canonifyURLs = true

[outputs]
  home = ["HTML", "RSS", "JSON", "SITEMAP"]

[params]
  env = "production"
  title = "pgAssistant — Continuous PostgreSQL Improvement"
  description = "Documentation and articles for pgAssistant, a continuous PostgreSQL improvement platform"
  keywords = ["PostgreSQL", "pgAssistant", "Performance", "Database optimization", "Workload analysis", "Executive Plan", "Workload Insights"]
  author = "beh74"
  ShowShareButtons = true
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowToc = true
  enableSearch = true
  defaultTheme = "light"
  disableThemeToggle = false
  googleAnalytics = ""


[params.label]
  text = "pgAssistant"
  iconSVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 116" fill="none"><path d="M55 24C41 7 12 15 12 43c0 23 17 36 38 29V51" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M55 24C68 10 91 17 91 37c0 12-9 21-17 31-5 6-9 13-5 19" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="76" cy="38" r="3.5" fill="currentColor"/><path d="M50 51v32c0 25 38 27 48-1" fill="none" stroke="#00a9b8" stroke-width="7" stroke-linecap="round"/><path d="m88 84 12-6 3 13" fill="none" stroke="#00a9b8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  iconHeight = 36

[params.editPost]
  URL = "https://github.com/beh74/pgassistant-blog/tree/main/content"
  Text = "Suggest Changes"
  appendFilePath = true

[[menu.main]]
  name = "Posts"
  url = "/post/"
  weight = 1

[[menu.main]]
  name = "Documentation"
  url = "/doc/"
  weight = 1

[[menu.main]]
  name = "Tags"
  url = "tags/"
  weight = 1

[[menu.main]]
  name = "Search"
  url = "search/"
  weight = 1


[params.assets]
  favicon = "images/brand/pgassistant-favicon.svg"
  favicon16x16 = "images/brand/favicon-16.png"
  favicon32x32 = "images/brand/favicon-32.png"
  apple_touch_icon = "images/brand/apple-touch-icon.png"
