
baseURL = "https://beh74.github.io/pgassistant-blog/"
languageCode = "en-us"
title = "pgAssistant — Continuous PostgreSQL Improvement"
theme = "PaperMod"
pagination.pagerSize = 10
defaultContentLanguage = "en"

#relativeURLs = true
#canonifyURLs = true

[outputs]
  home = ["HTML", "RSS", "JSON", "SITEMAP"]

[params]
  env = "production"
  title = "pgAssistant — Continuous PostgreSQL Improvement"
  description = "Documentation and articles for pgAssistant, a continuous PostgreSQL improvement platform"
  keywords = ["PostgreSQL", "pgAssistant", "Performance", "Database optimization", "Workload analysis", "Executive Plan", "Workload Insights"]
  author = "beh74"
  ShowShareButtons = true
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowToc = true
  enableSearch = true
  defaultTheme = "light"
  disableThemeToggle = false
  googleAnalytics = ""


[params.label]
  text = "pgAssistant"
  icon = "images/logo.png"
  iconHeight = 36

[params.editPost]
  URL = "https://github.com/beh74/pgassistant-blog/tree/main/content"
  Text = "Suggest Changes"
  appendFilePath = true

[[menu.main]]
  name = "Posts"
  url = "/post/"
  weight = 1

[[menu.main]]
  name = "Documentation"
  url = "/doc/"
  weight = 1

[[menu.main]]
  name = "Tags"
  url = "tags/"
  weight = 1

[[menu.main]]
  name = "Search"
  url = "search/"
  weight = 1

