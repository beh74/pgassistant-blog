<section class="tools-section" aria-labelledby="tools-heading">
  <div class="section-heading"><div><p class="eyebrow">THE PGASSISTANT ECOSYSTEM</p><h2 id="tools-heading">Four tools. A continuous improvement loop.</h2></div></div>
  <div class="tools-grid">
    {{ range site.Data.tools }}
    <article class="tool-card">
      <div class="tool-icon">{{ partial "tool-icon.html" .icon }}</div>
      <h3><a href="{{ .url | relURL }}">{{ .name }}</a></h3>
      <p>{{ .description }}</p>
      <div class="tool-links">
        <a class="read-more" href="{{ .url | relURL }}">{{ .linkLabel }} <span aria-hidden="true">→</span></a>
        <a class="github-link" href="{{ .github }}" aria-label="pgAssistant {{ .name }} on GitHub" title="pgAssistant {{ .name }} on GitHub"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.5-.28-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.02-.12-.28-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.15a10.8 10.8 0 0 1 5.63 0c2.15-1.46 3.1-1.15 3.1-1.15.61 1.55.23 2.7.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.32-2.63 5.28-5.14 5.56.4.35.76 1.03.76 2.08v3.1c0 .3.2.65.77.54A11.25 11.25 0 0 0 12 .75Z"/></svg></a>
      </div>
    </article>
    {{ end }}
  </div>
</section>
